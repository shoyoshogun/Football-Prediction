<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Football Predictions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🏈 Live Score Prediction Board</h1>
      <div class="score-row">
        <div>
          <div id="teamAName" class="team-name">Team A</div>
          <div id="teamAScore" class="live-score">0</div>
        </div>
        <div class="score-separator">-</div>
        <div>
          <div id="teamBName" class="team-name">Team B</div>
          <div id="teamBScore" class="live-score">0</div>
        </div>
      </div>
    </section>

    <div class="display-layout">
      <section class="card">
        <h2>Closest Predictions</h2>
        <p class="subtitle">Automatically re-ranked whenever the current score changes.</p>
        <div id="leaderboard" class="leaderboard">
          <p class="small">Waiting for predictions...</p>
        </div>
      </section>

      <aside class="card qr-card">
        <h2>Scan to Play</h2>
        <div id="qrcode"></div>
        <p class="small" id="qrText">Open this page from your hosted website to create the QR code.</p>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    let game = {
      teamA: "Team A",
      teamB: "Team B",
      scoreA: 0,
      scoreB: 0
    };

    let predictions = [];

    const gameRef = db.ref("game");
    const predictionsRef = db.ref("predictions");

    function scoreDistance(p) {
      return Math.abs(p.predA - Number(game.scoreA || 0)) +
             Math.abs(p.predB - Number(game.scoreB || 0));
    }

    function render() {
      document.getElementById("teamAName").textContent = game.teamA;
      document.getElementById("teamBName").textContent = game.teamB;
      document.getElementById("teamAScore").textContent = game.scoreA ?? 0;
      document.getElementById("teamBScore").textContent = game.scoreB ?? 0;

      const sorted = [...predictions].sort((a, b) => {
        const diff = scoreDistance(a) - scoreDistance(b);
        if (diff !== 0) return diff;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });

      const board = document.getElementById("leaderboard");

      if (!sorted.length) {
        board.innerHTML = '<p class="small">Waiting for predictions...</p>';
        return;
      }

      board.innerHTML = sorted.map((p, i) => {
        const distance = scoreDistance(p);
        const topClass = i < 3 ? "top" : "";
        const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i + 1}`;

        return `
          <div class="prediction ${topClass}">
            <div class="rank">${medal}</div>
            <div class="person">${escapeHtml(p.name)}</div>
            <div class="pick">${p.predA} - ${p.predB}</div>
            <div class="distance">${distance === 0 ? "EXACT" : distance + " away"}</div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    gameRef.on("value", snapshot => {
      if (snapshot.exists()) game = { ...game, ...snapshot.val() };
      render();
    });

    predictionsRef.on("value", snapshot => {
      predictions = [];
      snapshot.forEach(child => {
        predictions.push({ id: child.key, ...child.val() });
      });
      render();
    });

    // QR code points to index.html in the same hosted folder.
    const predictionUrl = new URL("index.html", window.location.href).href;
    document.getElementById("qrText").textContent = predictionUrl;

    new QRCode(document.getElementById("qrcode"), {
      text: predictionUrl,
      width: 220,
      height: 220
    });
  </script>
</body>
</html>
