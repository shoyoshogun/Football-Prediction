<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Prediction Admin</title><link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

<section id="loginCard" class="login-wrap">
  <div class="login-card">
    <img src="assets/tamu-logo.png" alt="Texas A&M">
    <h1>Admin Login</h1>
    <p>Use your Firebase email/password admin account.</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required>
      <label>Password</label>
      <input id="password" type="password" required>
      <button class="primary">Log In</button>
      <div id="loginStatus" class="admin-status"></div>
    </form>
  </div>
</section>

<main id="adminApp" class="admin-shell hidden">
  <header class="admin-top">
    <div class="brand">
      <img src="assets/tamu-logo.png" alt="Texas A&M">
      <div>
        <h1>Football Prediction Game</h1>
        <small>Admin Panel</small>
      </div>
    </div>
    <button id="logoutBtn" class="signout">Sign Out</button>
  </header>

  <nav class="tabs">
    <div class="tab active">Game Control</div>
    <div class="tab">Predictions</div>
    <div class="tab">Settings</div>
  </nav>

  <section class="admin-card">
    <h2>🏈 Current Matchup</h2>

    <div class="admin-match">
      <div class="admin-team home">
        <img id="previewLogoA" src="assets/tamu-logo.png" alt="">
        <div id="previewNameA" class="team-name">Texas A&M</div>
      </div>

      <div class="predict-vs">VS</div>

      <div class="admin-team away">
        <img id="previewLogoB" src="assets/alabama-logo.png" alt="">
        <div id="previewNameB" class="team-name">Alabama</div>
      </div>
    </div>

    <form id="gameForm">
      <div class="grid2">
        <div>
          <label>Team A Name</label>
          <input id="teamA" required>

          <label>Team A Logo URL</label>
          <input id="logoA" placeholder="assets/tamu-logo.png">

          <label>Team A Current Score</label>
          <input id="scoreA" type="number" min="0" max="100" required>
        </div>

        <div>
          <label>Team B Name</label>
          <input id="teamB" required>

          <label>Team B Logo URL</label>
          <input id="logoB" placeholder="assets/alabama-logo.png">

          <label>Team B Current Score</label>
          <input id="scoreB" type="number" min="0" max="100" required>
        </div>
      </div>

      <div class="grid3">
        <div>
          <label>Game Date</label>
          <input id="gameDate" placeholder="Sat, Oct 4, 2025">
        </div>

        <div>
          <label>Kickoff</label>
          <input id="kickoff" placeholder="TBD">
        </div>

        <div>
          <label>Location</label>
          <input id="location" placeholder="College Station, TX">
        </div>
      </div>

      <button class="primary">Update Matchup / Live Score</button>
      <div id="gameStatus" class="admin-status"></div>
    </form>
  </section>

  <section class="admin-card">
    <h2>Game Status</h2>

    <div class="actions">
      <button id="lockBtn" class="btn maroon">🔒 Lock Predictions</button>
      <button id="unlockBtn" class="btn light">🔓 Reopen Predictions</button>
      <button id="endBtn" class="btn dark">🏁 End Game / Show Winner</button>
    </div>

    <div class="actions" style="margin-top:10px">
      <button id="resumeBtn" class="btn light">↩ Resume Game</button>
      <button id="resetPredictions" class="btn danger">Delete All Predictions</button>
      <button id="newGameBtn" class="btn danger">New Game Reset</button>
    </div>

    <div id="controlStatus" class="admin-status"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const $=id=>document.getElementById(id);

auth.onAuthStateChanged(u=>{
  if(u&&!u.isAnonymous){
    $("loginCard").classList.add("hidden");
    $("adminApp").classList.remove("hidden");
  }else{
    $("loginCard").classList.remove("hidden");
    $("adminApp").classList.add("hidden");
  }
});

$("loginForm").onsubmit=async e=>{
  e.preventDefault();
  try{
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    $("loginStatus").textContent="";
  }catch(err){
    $("loginStatus").textContent="Login failed.";
    $("loginStatus").className="admin-status error";
  }
};

$("logoutBtn").onclick=()=>auth.signOut();

db.ref("game").on("value",s=>{
  const g=s.val()||{};

  $("teamA").value=g.teamA||"Texas A&M";
  $("teamB").value=g.teamB||"Alabama";
  $("logoA").value=g.logoA||"assets/tamu-logo.png";
  $("logoB").value=g.logoB||"assets/alabama-logo.png";
  $("scoreA").value=g.scoreA??0;
  $("scoreB").value=g.scoreB??0;
  $("gameDate").value=g.gameDate||"TBD";
  $("kickoff").value=g.kickoff||"TBD";
  $("location").value=g.location||"College Station, TX";

  $("previewNameA").textContent=g.teamA||"Texas A&M";
  $("previewNameB").textContent=g.teamB||"Alabama";
  $("previewLogoA").src=g.logoA||"assets/tamu-logo.png";
  $("previewLogoB").src=g.logoB||"assets/alabama-logo.png";
});

$("gameForm").onsubmit=async e=>{
  e.preventDefault();

  try{
    await db.ref("game").update({
      teamA:$("teamA").value.trim(),
      teamB:$("teamB").value.trim(),
      logoA:$("logoA").value.trim(),
      logoB:$("logoB").value.trim(),
      scoreA:Number($("scoreA").value),
      scoreB:Number($("scoreB").value),
      gameDate:$("gameDate").value.trim(),
      kickoff:$("kickoff").value.trim(),
      location:$("location").value.trim()
    });

    $("gameStatus").textContent="Updated.";
    $("gameStatus").className="admin-status";
  }catch(err){
    $("gameStatus").textContent="Update failed.";
    $("gameStatus").className="admin-status error";
  }
};

async function control(data,msg){
  try{
    await db.ref("game").update(data);
    $("controlStatus").textContent=msg;
    $("controlStatus").className="admin-status";
  }catch(err){
    $("controlStatus").textContent="Action failed.";
    $("controlStatus").className="admin-status error";
  }
}

$("lockBtn").onclick=()=>control({locked:true},"Predictions locked.");
$("unlockBtn").onclick=()=>control({locked:false,ended:false},"Predictions reopened.");
$("endBtn").onclick=()=>control({locked:true,ended:true},"Game ended. Winner shown on display.");
$("resumeBtn").onclick=()=>control({ended:false},"Game resumed.");

$("resetPredictions").onclick=async()=>{
  if(confirm("Delete ALL predictions?")){
    await db.ref("predictions").remove();
    $("controlStatus").textContent="Predictions deleted.";
  }
};

$("newGameBtn").onclick=async()=>{
  if(confirm("Start a new game? This deletes all predictions and resets the score.")){
    await db.ref("predictions").remove();
    await db.ref("game").update({
      scoreA:0,
      scoreB:0,
      locked:false,
      ended:false
    });
    $("controlStatus").textContent="New game ready.";
  }
};
</script>
</body>
</html>
