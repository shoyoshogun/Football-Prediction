<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<main class="container"><section id="loginCard" class="card login-card"><h1>🔒 Admin Login</h1><p class="subtitle">Use the Firebase email/password account you create for yourself.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Log In</button><div id="loginStatus" class="status"></div></form></section>
<div id="adminApp" class="hidden"><section class="card hero"><h1>⚙️ Football Prediction Admin</h1><button id="logoutBtn" class="secondary">Log Out</button></section>
<section class="card"><h2>Teams & Live Score</h2><form id="gameForm"><div class="grid-2"><div><label>Team A</label><input id="teamA" required><label>Logo URL (optional)</label><input id="logoA" type="url"><label>Score</label><input id="scoreA" type="number" min="0" max="100" required></div><div><label>Team B</label><input id="teamB" required><label>Logo URL (optional)</label><input id="logoB" type="url"><label>Score</label><input id="scoreB" type="number" min="0" max="100" required></div></div><button>Update Teams / Live Score</button><div id="gameStatus" class="status"></div></form></section>
<section class="card"><h2>Game Controls</h2><div class="actions"><button id="lockBtn" class="gold">🔒 Lock Predictions</button><button id="unlockBtn" class="secondary">🔓 Reopen Predictions</button><button id="endBtn">🏁 End Game / Show Winner</button></div><div class="actions"><button id="resumeBtn" class="secondary">↩️ Resume Game</button><button id="resetPredictions" class="danger">🗑️ Delete All Predictions</button><button id="newGameBtn" class="danger">♻️ New Game Reset</button></div><div id="controlStatus" class="status"></div></section></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
auth.onAuthStateChanged(u=>{if(u&&!u.isAnonymous){loginCard.classList.add("hidden");adminApp.classList.remove("hidden")}else{loginCard.classList.remove("hidden");adminApp.classList.add("hidden")}});
loginForm.onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value);loginStatus.textContent=""}catch(err){loginStatus.textContent="Login failed.";loginStatus.className="status warning"}};
logoutBtn.onclick=()=>auth.signOut();
db.ref("game").on("value",s=>{const g=s.val()||{};teamA.value=g.teamA||"Texas A&M";teamB.value=g.teamB||"Opponent";scoreA.value=g.scoreA??0;scoreB.value=g.scoreB??0;logoA.value=g.logoA||"";logoB.value=g.logoB||""});
gameForm.onsubmit=async e=>{e.preventDefault();await db.ref("game").update({teamA:teamA.value.trim(),teamB:teamB.value.trim(),logoA:logoA.value.trim(),logoB:logoB.value.trim(),scoreA:Number(scoreA.value),scoreB:Number(scoreB.value)});gameStatus.textContent="Updated."};
async function ctrl(data,msg){try{await db.ref("game").update(data);controlStatus.textContent=msg}catch(e){controlStatus.textContent="Action failed.";controlStatus.className="status warning"}}
lockBtn.onclick=()=>ctrl({locked:true},"Predictions locked.");unlockBtn.onclick=()=>ctrl({locked:false,ended:false},"Predictions reopened.");endBtn.onclick=()=>ctrl({locked:true,ended:true},"Game ended. Winner shown.");resumeBtn.onclick=()=>ctrl({ended:false},"Game resumed.");
resetPredictions.onclick=async()=>{if(confirm("Delete ALL predictions?")){await db.ref("predictions").remove();controlStatus.textContent="Predictions deleted."}};
newGameBtn.onclick=async()=>{if(confirm("Start a new game and delete all predictions?")){await db.ref("predictions").remove();await db.ref("game").update({scoreA:0,scoreB:0,locked:false,ended:false});controlStatus.textContent="New game reset complete."}};
</script></body></html>
