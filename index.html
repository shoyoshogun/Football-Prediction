<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Predictions</title><link rel="stylesheet" href="style.css"></head><body>
<main class="container"><section class="card hero center"><div id="lockBadge" class="badge open">🟢 Predictions Open</div><h1 style="margin-top:14px">🏈 Live Score Prediction Board</h1>
<div class="score-row"><div><img id="logoA" class="team-logo"><div id="teamAName" class="team-name">Team A</div><div id="teamAScore" class="live-score">0</div></div><div class="score-separator">–</div><div><img id="logoB" class="team-logo"><div id="teamBName" class="team-name">Team B</div><div id="teamBScore" class="live-score">0</div></div></div></section>
<div class="display-layout"><section class="card"><div id="winnerArea"></div><h2 id="boardTitle">Closest Predictions</h2><p class="subtitle" id="boardSubtitle">Ranks update automatically as the score changes.</p><div id="leaderboard" class="leaderboard"></div></section>
<aside class="card qr-card"><h2>Scan to Play</h2><div id="qrcode"></div><p class="small">One prediction per device/account.</p><p class="small" id="qrText"></p></aside></div></main><footer>Gig ’em 👍 • Football Prediction Board</footer>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
let game={teamA:"Team A",teamB:"Team B",scoreA:0,scoreB:0,logoA:"",logoB:"",locked:false,ended:false},predictions=[];
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function setLogo(id,url){const i=document.getElementById(id);if(url){i.src=url;i.classList.add("show")}else{i.classList.remove("show")}}
function dist(p){return Math.abs(p.predA-(game.scoreA||0))+Math.abs(p.predB-(game.scoreB||0))}
function render(){teamAName.textContent=game.teamA;teamBName.textContent=game.teamB;teamAScore.textContent=game.scoreA||0;teamBScore.textContent=game.scoreB||0;setLogo("logoA",game.logoA);setLogo("logoB",game.logoB);
if(game.ended){lockBadge.textContent="🏁 FINAL";lockBadge.className="badge locked"}else if(game.locked){lockBadge.textContent="🔒 Predictions Locked";lockBadge.className="badge locked"}else{lockBadge.textContent="🟢 Predictions Open";lockBadge.className="badge open"}
const s=[...predictions].sort((a,b)=>dist(a)-dist(b)||(a.createdAt||0)-(b.createdAt||0));
boardTitle.textContent=game.ended?"Final Rankings":"Closest Predictions";boardSubtitle.textContent=game.ended?"Ranked by closeness to the final score.":"Ranks update automatically as the score changes.";
winnerArea.innerHTML="";if(game.ended&&s.length){const best=dist(s[0]),w=s.filter(p=>dist(p)===best);winnerArea.innerHTML=`<div class="winner-banner"><h2>${best===0?"🎯 Exact Score Winner":"🏆 Closest Prediction Winner"}</h2><div style="font-size:22px;font-weight:900">${w.map(x=>esc(x.name)).join(", ")}</div><div>${best===0?"Predicted the final score exactly.":best+" total points away."}</div></div>`}
leaderboard.innerHTML=s.length?s.map((p,i)=>`<div class="prediction ${i===0?"top1":i===1?"top2":i===2?"top3":""}"><div class="rank">${i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1)}</div><div class="person">${esc(p.name)}</div><div class="pick">${p.predA} – ${p.predB}</div><div class="distance">${dist(p)===0?"EXACT":dist(p)+" away"}</div></div>`).join(""):'<p class="small">Waiting for predictions...</p>'}
db.ref("game").on("value",s=>{if(s.exists())game={...game,...s.val()};render()});db.ref("predictions").on("value",s=>{predictions=[];s.forEach(c=>predictions.push({id:c.key,...c.val()}));render()});
const url=new URL("predict.html",location.href).href;qrText.textContent=url;new QRCode(document.getElementById("qrcode"),{text:url,width:220,height:220});
</script></body></html>
