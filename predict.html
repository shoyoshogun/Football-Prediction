<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Prediction</title><link rel="stylesheet" href="style.css"></head><body>
<main class="container">
<section class="card hero center"><div id="lockBadge" class="badge open">🟢 Predictions Open</div><h1 style="margin-top:14px">🏈 A&M Football Score Prediction</h1><p class="subtitle">One prediction per browser/device account. Choose carefully.</p>
<div class="score-row"><div><img id="logoA" class="team-logo"><div id="teamAName" class="team-name">Team A</div><div id="teamAScore" class="live-score">0</div></div><div class="score-separator">–</div><div><img id="logoB" class="team-logo"><div id="teamBName" class="team-name">Team B</div><div id="teamBScore" class="live-score">0</div></div></div></section>
<section class="card"><div id="alreadySubmitted" class="hidden"><h2>✅ Prediction Submitted</h2><p id="savedPrediction"></p><p class="small">This browser/device account already used its one prediction.</p></div>
<form id="predictionForm"><h2>Make Your Prediction</h2><label for="name">Your name</label><input id="name" maxlength="30" required placeholder="Your name">
<div class="grid-2"><div><label id="teamALabel" for="predA">Team A final score</label><input id="predA" type="number" min="0" max="100" required placeholder="24"></div><div><label id="teamBLabel" for="predB">Team B final score</label><input id="predB" type="number" min="0" max="100" required placeholder="21"></div></div>
<button id="submitBtn" type="submit">Submit My One Prediction</button><div id="status" class="status"></div></form></section></main><footer>Gig ’em 👍 • Football Prediction Board</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
let game={teamA:"Team A",teamB:"Team B",scoreA:0,scoreB:0,logoA:"",logoB:"",locked:false,ended:false},currentUser=null;
const form=document.getElementById("predictionForm"),already=document.getElementById("alreadySubmitted"),submitBtn=document.getElementById("submitBtn"),statusEl=document.getElementById("status");
function setLogo(id,url){const i=document.getElementById(id);if(url){i.src=url;i.classList.add("show")}else{i.classList.remove("show")}}
function renderGame(){teamAName.textContent=game.teamA;teamBName.textContent=game.teamB;teamAScore.textContent=game.scoreA||0;teamBScore.textContent=game.scoreB||0;teamALabel.textContent=game.teamA+" final score";teamBLabel.textContent=game.teamB+" final score";setLogo("logoA",game.logoA);setLogo("logoB",game.logoB);if(game.ended){lockBadge.textContent="🏁 Game Ended";lockBadge.className="badge locked"}else if(game.locked){lockBadge.textContent="🔒 Predictions Locked";lockBadge.className="badge locked"}else{lockBadge.textContent="🟢 Predictions Open";lockBadge.className="badge open"}submitBtn.disabled=!!game.locked||!!game.ended}
async function checkExisting(){if(!currentUser)return;const s=await db.ref("predictions/"+currentUser.uid).once("value");if(s.exists()){const p=s.val();form.classList.add("hidden");already.classList.remove("hidden");savedPrediction.textContent=`${p.name}: ${game.teamA} ${p.predA} – ${p.predB} ${game.teamB}`}}
auth.onAuthStateChanged(async u=>{if(u){currentUser=u;await checkExisting()}});
auth.signInAnonymously().catch(()=>{statusEl.textContent="Enable Anonymous Authentication in Firebase.";statusEl.className="status warning"});
db.ref("game").on("value",s=>{if(s.exists())game={...game,...s.val()};renderGame();if(currentUser)checkExisting()});
form.addEventListener("submit",async e=>{e.preventDefault();if(!currentUser||game.locked||game.ended)return;const name=document.getElementById("name").value.trim(),predA=Number(document.getElementById("predA").value),predB=Number(document.getElementById("predB").value);try{const r=db.ref("predictions/"+currentUser.uid),s=await r.once("value");if(s.exists())return checkExisting();await r.set({uid:currentUser.uid,name,predA,predB,createdAt:firebase.database.ServerValue.TIMESTAMP});await checkExisting()}catch(err){console.error(err);statusEl.textContent="Could not save. It may be locked or already submitted.";statusEl.className="status warning"}});
</script></body></html>
